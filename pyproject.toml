[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpckit"
version = "0.1.0"
description = "HPC orchestration CLI for SSH, Slurm run packets, receipts, and artifact sync."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ricardo A. S. Frantz" },
]
keywords = ["hpc", "slurm", "ssh", "cluster", "nek5000", "workflow", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# hpckit itself only dispatches; it needs nothing but a YAML parser. The
# renderer extra pulls in quadros for anyone who wants to render locally as
# well as on the cluster. It is deliberately optional: quadros brings VTK,
# which is ~700 MB, and a machine that only submits jobs should not pay that.
renderer = [
  "quadros",
]

[tool.uv.sources]
# Development-only: resolve the renderer extra from the sibling checkout, since
# quadros is not published yet. uv strips this from published metadata, so the
# wheel still declares a plain `quadros` requirement. Remove once quadros is on
# a package index.
quadros = { path = "../quadros", editable = true }

[project.urls]
Homepage = "https://github.com/openfluids/hpckit"
Repository = "https://github.com/openfluids/hpckit"
Issues = "https://github.com/openfluids/hpckit/issues"

[project.scripts]
hpckit = "hpckit.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hpckit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
