[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpckit"
version = "0.2.0"
description = "HPC orchestration CLI for SSH, Slurm run packets, receipts, and artifact sync."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ricardo A. S. Frantz" },
]
keywords = ["hpc", "slurm", "ssh", "cluster", "nek5000", "workflow", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/openfluids/hpckit"
Repository = "https://github.com/openfluids/hpckit"
Issues = "https://github.com/openfluids/hpckit/issues"

[project.scripts]
hpckit = "hpckit.cli:main"

# Kept separate from the runtime dependencies on purpose: quadros pulls in VTK,
# roughly 700 MB, and a machine that only submits jobs should not pay that.
# This extra was removed before the first release because quadros was not yet
# published -- uv resolves every declared extra when locking, so depending on an
# unpublished package broke `uv lock` for everyone. quadros 0.1.0 is on PyPI now.
[project.optional-dependencies]
renderer = ["quadros>=0.1"]

[dependency-groups]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hpckit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
