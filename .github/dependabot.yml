version: 2
updates:
  # Actions are pinned to commit SHAs rather than tags, which is what stops a
  # mutable tag being repointed under us (the tj-actions/changed-files class of
  # compromise). A pin only stays current if something bumps it, so that is this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Without this, only the action pins are tracked and Python dependency drift is
  # invisible: the dev-tool floors in pyproject.toml rot behind upstream releases.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
